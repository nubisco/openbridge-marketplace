name: Deploy

on:
  workflow_run:
    workflows: [Release]
    branches: [master]
    types: [completed]
  workflow_dispatch:

jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Get version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_ANALYTICS_URL=${{ vars.VITE_ANALYTICS_URL }}
          tags: |
            ghcr.io/nubisco/openbridge-marketplace:${{ steps.pkg.outputs.version }}
            ghcr.io/nubisco/openbridge-marketplace:latest
          cache-from: type=gha
          # ignore-error keeps a GHA cache-export failure (e.g. cache quota
          # exhausted) from failing the job after the image is already pushed.
          cache-to: type=gha,mode=max,ignore-error=true
