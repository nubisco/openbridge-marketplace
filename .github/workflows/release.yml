name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GH_TOKEN, not the default GITHUB_TOKEN, and credentials kept.
          # semantic-release pushes the version bump and CHANGELOG back to
          # master, and master is protected: the built-in Actions token cannot
          # bypass that rule, so every release failed at the final push with
          # "GH006: Protected branch update failed". The sibling repos
          # (openbridge, openbridge-tuya-local-platform) already use GH_TOKEN
          # for exactly this reason.
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Disable local git hooks
        run: git config core.hooksPath /dev/null

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
